<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 px-4 py-6">
  <div class="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-3xl bg-white shadow-2xl">
    
    <!-- Header -->
    <div class="border-b border-slate-200 px-6 py-5">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h3 class="text-xl font-extrabold text-slate-900">
            {{ data.idUsuario ? 'Editar usuario' : 'Registrar usuario' }}
          </h3>
          <p class="mt-1 text-sm text-slate-500">
            Completa la información del usuario.
          </p>
        </div>

        <button
          type="button"
          (click)="cancelar()"
          class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5">
      
      <!-- Errores -->
      <div
        *ngIf="errores.length > 0"
        class="mb-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-xs text-red-700"
      >
        <div class="mb-2 flex items-center gap-2 font-bold">
          <span class="flex h-5 w-5 items-center justify-center rounded-full bg-red-100 text-red-600">
            !
          </span>
          <span>Corrige los siguientes campos</span>
        </div>

        <ul class="grid gap-1">
          <li *ngFor="let error of errores" class="flex gap-2">
            <span>•</span>
            <span>{{ error }}</span>
          </li>
        </ul>
      </div>

      <!-- Formulario -->
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        
        <div *ngIf="data.idUsuario">
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            ID
          </label>
          <input
            [ngModel]="data.idUsuario"
            name="idUsuario"
            disabled
            class="h-12 w-full rounded-xl border border-slate-300 bg-slate-50 px-4 text-sm text-slate-700 outline-none"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Nombre de usuario
          </label>
          <input
            [(ngModel)]="data.nameUsuario"
            name="nameUsuario"
            type="text"
            maxlength="80"
            placeholder="Ej. Juan Ayala"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Correo
          </label>
          <input
            [(ngModel)]="data.emailUsuario"
            name="emailUsuario"
            type="email"
            maxlength="100"
            placeholder="Ej. usuario@correo.com"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Contraseña
          </label>
          <input
            [(ngModel)]="data.passwordUsuario"
            name="passwordUsuario"
            type="password"
            maxlength="50"
            [placeholder]="data.idUsuario ? 'Solo si deseas cambiarla' : 'Ingresa una contraseña'"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
          <p class="mt-1 text-[11px] leading-4 text-slate-500">
            Mín. 8 caracteres, mayúscula, minúscula, número y carácter especial.
          </p>
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Edad
          </label>
          <input
            [(ngModel)]="data.ageUsuario"
            name="ageUsuario"
            type="number"
            min="18"
            max="100"
            placeholder="Ej. 25"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            DNI
          </label>
          <input
            [(ngModel)]="data.dniUsuario"
            name="dniUsuario"
            type="text"
            inputmode="numeric"
            maxlength="8"
            placeholder="Ej. 12345678"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Teléfono
          </label>
          <input
            [(ngModel)]="data.phoneUsuario"
            name="phoneUsuario"
            type="text"
            inputmode="numeric"
            maxlength="9"
            placeholder="Ej. 987654321"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>

        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-700">
            Rol
          </label>
          <select
            [(ngModel)]="data.rolUsuario"
            name="rolUsuario"
            class="h-12 w-full rounded-xl border border-slate-300 bg-white px-4 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          >
            <option value="ADMIN">Administrador</option>
            <option value="CLIENTE">Cliente</option>
            <option value="SOPORTE">Soporte</option>
          </select>
        </div>
      </div>

      <!-- Estado -->
      <div class="mt-5 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3">
        <label class="inline-flex items-center gap-3 text-sm font-medium text-slate-700">
          <input
            type="checkbox"
            [(ngModel)]="data.enabledUsuario"
            name="enabledUsuario"
            class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
          />
          Usuario activado
        </label>
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-slate-200 bg-slate-50 px-6 py-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
        <button
          type="button"
          (click)="cancelar()"
          class="inline-flex h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
        >
          Cancelar
        </button>

        <button
          type="button"
          (click)="guardar()"
          class="inline-flex h-11 items-center justify-center rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 px-5 text-sm font-semibold text-white shadow-md transition hover:-translate-y-0.5 hover:shadow-lg"
        >
          Registrar
        </button>
      </div>
    </div>
  </div>
</div>
